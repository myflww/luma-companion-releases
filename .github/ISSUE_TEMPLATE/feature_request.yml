name: 建议与文档纠错 / Suggestion
description: 说说你的使用场景或文档建议 / Share a use case or documentation correction
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎具体的使用场景和文档纠错。提交建议不代表该功能已排期或承诺上线。
        Suggestions are welcome; submission is not a release commitment. Do not include private data.
  - type: textarea
    id: situation
    attributes:
      label: 你想完成什么 / Your use case
      description: 描述目标和当前不便，或指出需要纠正的文档页面。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 你的建议 / Suggested improvement
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 当前替代办法 / Current workaround
    validations:
      required: false
